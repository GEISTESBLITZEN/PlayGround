<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowGreen" cx="22%" cy="58%" r="65%">
      <stop offset="0" stop-color="#2f8f5d" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#175f3e" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06120d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWater" cx="82%" cy="40%" r="55%">
      <stop offset="0" stop-color="#1c6f86" stop-opacity=".5"/>
      <stop offset="60%" stop-color="#0c3546" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06120d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a55"/>
      <stop offset=".45" stop-color="#0b3d4d"/>
      <stop offset="1" stop-color="#072433"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#3c6a34"/>
      <stop offset=".45" stop-color="#2a512b"/>
      <stop offset="1" stop-color="#173322"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#b49b64"/>
      <stop offset=".5" stop-color="#8f7c51"/>
      <stop offset="1" stop-color="#5d5a3a"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ffe9" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#d9ffe9" stop-opacity=".11"/>
      <stop offset="1" stop-color="#d9ffe9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4ffe0" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#d9ffb0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#baffc9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="#06120d"/>
  <rect width="1440" height="900" fill="url(#glowGreen)"/>
  <rect width="1440" height="900" fill="url(#glowWater)"/>

  <!-- distant haze -->
  <ellipse cx="900" cy="360" rx="520" ry="240" fill="url(#haze)" opacity=".8"/>

  <!-- water basin -->
  <path d="M690 -40 C 720 120 660 250 710 370 C 760 500 700 610 760 760 L 820 940 L 1500 940 L 1500 -40 Z" fill="url(#water)"/>
  <path d="M735 150 C 800 210 740 300 820 350 C 900 400 830 500 900 560" fill="none" stroke="#5dc6c0" stroke-opacity=".11" stroke-width="3"/>
  <path d="M770 430 C 860 470 820 560 920 600 C 1010 640 980 720 1080 760" fill="none" stroke="#79d8cf" stroke-opacity=".08" stroke-width="5"/>
  <path d="M860 90 C 930 150 890 230 980 270" fill="none" stroke="#79d8cf" stroke-opacity=".07" stroke-width="3"/>

  <!-- shoreline -->
  <path d="M650 -40 C 620 80 690 160 660 250 C 630 340 700 410 680 500 C 660 590 740 650 720 740 L 750 940 L 860 940 L 820 760 C 800 650 730 590 760 490 C 790 390 720 330 750 230 C 780 130 710 60 740 -40 Z" fill="url(#shore)" opacity=".9"/>
  <path d="M646 -40 C 616 80 686 160 656 250 C 626 340 696 410 676 500 C 656 590 736 650 716 740" fill="none" stroke="#e2d39b" stroke-opacity=".18" stroke-width="4"/>

  <!-- main land mass -->
  <path d="M-60 -60 L 690 -60 C 640 80 680 150 655 250 C 630 340 690 410 670 500 C 650 590 720 650 700 740 C 690 830 620 890 560 960 L -60 960 Z" fill="url(#land)"/>
  <path d="M-40 690 C 180 640 360 700 520 660 C 620 635 660 690 720 700 L 720 960 L -40 960 Z" fill="#1b3c26" opacity=".85"/>

  <!-- forest canopies -->
  <g fill="#122d1d" opacity=".9">
    <ellipse cx="90" cy="520" rx="150" ry="90"/>
    <ellipse cx="300" cy="580" rx="180" ry="100"/>
    <ellipse cx="480" cy="500" rx="130" ry="80"/>
    <ellipse cx="140" cy="760" rx="200" ry="120"/>
    <ellipse cx="430" cy="790" rx="230" ry="130"/>
  </g>
  <g fill="#1f4a2c" opacity=".75">
    <ellipse cx="170" cy="470" rx="80" ry="52"/>
    <ellipse cx="350" cy="540" rx="95" ry="58"/>
    <ellipse cx="520" cy="460" rx="70" ry="46"/>
    <ellipse cx="260" cy="720" rx="120" ry="70"/>
    <ellipse cx="540" cy="740" rx="130" ry="76"/>
  </g>
  <g fill="#2e6a3c" opacity=".42">
    <ellipse cx="210" cy="440" rx="42" ry="30"/>
    <ellipse cx="390" cy="510" rx="54" ry="34"/>
    <ellipse cx="500" cy="432" rx="34" ry="24"/>
    <ellipse cx="310" cy="690" rx="70" ry="40"/>
  </g>

  <!-- tree silhouettes -->
  <g fill="#0a1c12" opacity=".92">
    <g transform="translate(120 330)"><rect x="-7" y="80" width="14" height="150" rx="6"/><circle cx="0" cy="34" r="72"/><circle cx="-48" cy="74" r="50"/><circle cx="48" cy="72" r="52"/></g>
    <g transform="translate(292 372) scale(.8)"><rect x="-6" y="70" width="12" height="140" rx="6"/><circle cx="0" cy="28" r="64"/><circle cx="-42" cy="64" r="44"/><circle cx="42" cy="62" r="46"/></g>
    <g transform="translate(492 402) scale(.62)"><rect x="-6" y="70" width="12" height="140" rx="6"/><circle cx="0" cy="28" r="64"/><circle cx="-42" cy="64" r="44"/><circle cx="42" cy="62" r="46"/></g>
    <g transform="translate(46 690) scale(1.05)"><rect x="-8" y="80" width="16" height="170" rx="7"/><circle cx="0" cy="34" r="78"/><circle cx="-52" cy="78" r="54"/><circle cx="52" cy="76" r="56"/></g>
    <g transform="translate(560 700) scale(.7)"><rect x="-6" y="70" width="12" height="150" rx="6"/><circle cx="0" cy="28" r="64"/><circle cx="-42" cy="64" r="44"/><circle cx="42" cy="62" r="46"/></g>
  </g>

  <!-- shoreline trees -->
  <g fill="#08170f" opacity=".85">
    <g transform="translate(620 190) scale(.55)"><rect x="-6" y="70" width="12" height="140" rx="6"/><circle cx="0" cy="28" r="64"/><circle cx="-42" cy="64" r="44"/><circle cx="42" cy="62" r="46"/></g>
    <g transform="translate(628 540) scale(.48)"><rect x="-6" y="70" width="12" height="140" rx="6"/><circle cx="0" cy="28" r="64"/><circle cx="-42" cy="64" r="44"/><circle cx="42" cy="62" r="46"/></g>
  </g>

  <!-- moon glow -->
  <circle cx="1000" cy="180" r="130" fill="url(#moon)" opacity=".55"/>
  <circle cx="1000" cy="180" r="34" fill="#f1ffe0" opacity=".9"/>
  <circle cx="1000" cy="180" r="34" fill="none" stroke="#d9ffb0" stroke-opacity=".5" stroke-width="2"/>

  <!-- small creatures on shore -->
  <g fill="#071410" opacity=".9">
    <g transform="translate(700 610)">
      <ellipse cx="0" cy="12" rx="22" ry="13"/>
      <path d="M-18 4 C -30 -8 -42 -10 -50 -4 C -38 -2 -30 6 -20 10 Z"/>
      <circle cx="20" cy="2" r="10"/>
      <path d="M24 -4 l 10 -14 l 2 16 z"/>
      <rect x="-14" y="20" width="5" height="12" rx="2"/>
      <rect x="4" y="20" width="5" height="12" rx="2"/>
    </g>
    <g transform="translate(660 725) scale(.72) rotate(12)">
      <ellipse cx="0" cy="12" rx="22" ry="13"/>
      <path d="M-18 4 C -30 -8 -42 -10 -50 -4 C -38 -2 -30 6 -20 10 Z"/>
      <circle cx="20" cy="2" r="10"/>
      <path d="M24 -4 l 10 -14 l 2 16 z"/>
      <rect x="-14" y="20" width="5" height="12" rx="2"/>
      <rect x="4" y="20" width="5" height="12" rx="2"/>
    </g>
  </g>

  <!-- fireflies -->
  <g fill="#c8ffb0">
    <circle cx="360" cy="260" r="2.4" opacity=".8"/>
    <circle cx="512" cy="336" r="1.8" opacity=".55"/>
    <circle cx="244" cy="640" r="2" opacity=".7"/>
    <circle cx="448" cy="596" r="1.6" opacity=".5"/>
    <circle cx="864" cy="760" r="1.8" opacity=".45"/>
    <circle cx="1120" cy="332" r="2" opacity=".35"/>
    <circle cx="780" cy="120" r="1.6" opacity=".4"/>
  </g>
  <g fill="#bfffe0" opacity=".25">
    <circle cx="360" cy="260" r="12"/>
    <circle cx="360" cy="260" r="6" opacity=".7"/>
    <circle cx="244" cy="640" r="10"/>
    <circle cx="244" cy="640" r="5" opacity=".7"/>
  </g>

  <!-- vignette -->
  <rect width="1440" height="900" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>
</svg>
